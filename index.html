<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hợi & Ninh phiêu lưu kí</title>

    <style>
        body {
            margin: 0;
            font-family: "Arial", sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffc5df);
            min-height: 100vh;
            color: #8f4163;
        }

        .khung {
            padding: 55px 20px;
        }

        h1 {
            color: #ff5795;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px white;
        }

        .phu-de {
            font-size: 18px;
            color: #c34d7e;
            margin-bottom: 35px;
        }

        .anh-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .anh {
            width: 280px;
            height: 350px;
            object-fit: cover;
            border-radius: 25px;
            border: 7px solid white;
            box-shadow: 0 8px 20px rgba(255, 92, 154, 0.3);
        }

        .ten {
            background: white;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 12px;
            color: #ff5795;
            font-weight: bold;
        }

        .noi-dung {
            background: rgba(255, 255, 255, 0.75);
            max-width: 650px;
            margin: 40px auto 0;
            padding: 22px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(255, 92, 154, 0.15);
        }

        .trang-tri {
            font-size: 25px;
            margin: 15px;
        }
    </style>
</head>

<body>

    <div class="khung">

        <div class="trang-tri">🌸 🎀 🌷 🎀 🌸</div>

        <h1>Hợi & Ninh phiêu lưu kí</h1>

        <p class="phu-de">
            ✨ Một chuyến phiêu lưu đầy những điều bất ngờ ✨
        </p>

        <div class="anh-container">

            <div>
                <img class="anh" src="hoi.jpg" alt="Hợi">
                <br>
                <div class="ten">🐷 Hợi</div>
            </div>

            <div>
                <img class="anh" src="ninh.jpg" alt="Ninh">
                <br>
                <div class="ten">🌸 Ninh</div>
            </div>

        </div>

        <div class="noi-dung">
            <p>💗 Chào mừng đến với câu chuyện của Hợi & Ninh 💗</p>

            <p>
                Cùng hai nhân vật bắt đầu một hành trình
                đầy những cuộc phiêu lưu và những điều bất ngờ nhé! ✨
            </p>
        </div>

        <div class="trang-tri">🌷 💕 🌷 💕 🌷</div>

    </div>

</body>
</html>
